<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Shop – Sign in</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;display:grid;place-items:center;min-height:100vh}
  .card{background:#fff;padding:32px;border-radius:12px;width:320px;box-shadow:0 4px 20px #0001}
  h1{font-size:22px;margin:0 0 20px} label{display:block;font-size:14px;margin:12px 0 4px}
  input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px}
  button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:6px;background:#2754d6;color:#fff;font-size:15px;cursor:pointer}
  .err{color:#c62828;font-size:14px;margin-top:12px;min-height:18px}
  .hint{font-size:12px;color:#777;margin-top:16px}
</style>
</head>
<body>
<form class="card" id="f">
  <h1>Sign in to Demo Shop</h1>
  <label for="username">Username</label>
  <input id="username" name="username" placeholder="Enter username" autocomplete="off">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" placeholder="Enter password">
  <button type="submit">Login</button>
  <div class="err" id="err"></div>
  <div class="hint">Demo account: tester / Pass@123</div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const r = await fetch('/demo/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({username: username.value, password: password.value})});
  if (r.ok) location.href = '/demo/dashboard.html';
  else err.textContent = 'Invalid username or password';
});
</script>
</body>
</html>
